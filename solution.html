  <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle dark/light theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg></button>

<div class="page-hero">
  <div class="eyebrow">Answer Key</div>
  <h1>Mock Test Solutions</h1>
  <p>Check your answers exam-by-exam, with the latest paper always at the top.</p>
</div>

<div class="test-shell" style="max-width:750px;">
  <div class="panel">
    <label for="examSelect" style="display:block; font-weight:600; color:#fff; margin-bottom:8px;">Choose Exam</label>
    <select id="examSelect" class="select-field">
      <option value="">-- Select Exam --</option>
      <option value="ssc">SSC</option>
      <option value="jee">JEE</option>
      <option value="neet">NEET</option>
      <option value="nda">NDA</option>
    </select>

    <div id="searchWrapper" style="display:none; margin-top:14px;">
      <input type="text" id="searchBox" class="select-field" placeholder="Search solutions...">
    </div>

    <div id="solutionList" style="margin-top:20px;"></div>
  </div>
</div>

<footer class="site-footer">
  &copy; 2026 <strong>Quantum World</strong> · part of rozzkuchhnaya

    <a href="index.html">rozzkuchhnaya</a>
    <a href="mocktest.html">Mock Test</a>
    <a href="aboutmock.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
</footer>

<script>
  function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("active");
  }

  const RK_SUN_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>';
  const RK_MOON_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  (function initTheme() {
    const saved = localStorage.getItem('rk-theme');
    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
  function toggleTheme() {
    const root = document.documentElement;
    const isLight = root.getAttribute('data-theme') === 'light';
    if (isLight) { root.removeAttribute('data-theme'); localStorage.setItem('rk-theme', 'dark'); }
    else { root.setAttribute('data-theme', 'light'); localStorage.setItem('rk-theme', 'light'); }
    const btn = document.getElementById('themeToggleBtn');
    if (btn) btn.innerHTML = root.getAttribute('data-theme') === 'light' ? RK_MOON_ICON : RK_SUN_ICON;
  }
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('themeToggleBtn');
    if (btn) btn.innerHTML = document.documentElement.getAttribute('data-theme') === 'light' ? RK_MOON_ICON : RK_SUN_ICON;
  });

  const solutions = {
    ssc: [
      { name: "Solution", file: "pdfs/SSC_day1.pdf", date: "2025-08-27" },
    ],
    jee: [
      { name: "Day 1 Solution", file: "", date: "2025-08-25" },
    ],
    neet: [
      { name: "Solution", file: "pdfs/NEET.pdf", date: "2025-08-27" }
    ],
    nda: [
      { name: "Solution", file: "pdfs/NDA.pdf", date: "2025-08-27" }
    ]
  };

  const examSelect = document.getElementById("examSelect");
  const solutionList = document.getElementById("solutionList");
  const searchBox = document.getElementById("searchBox");
  const searchWrapper = document.getElementById("searchWrapper");

  let currentSolutions = [];

  examSelect.addEventListener("change", function () {
    const exam = this.value;
    solutionList.innerHTML = "";

    if (exam && solutions[exam]) {
      searchWrapper.style.display = "block";
      searchBox.value = "";
      currentSolutions = solutions[exam].sort((a, b) => new Date(b.date) - new Date(a.date));
      renderSolutions(currentSolutions);
    } else {
      searchWrapper.style.display = "none";
      currentSolutions = [];
    }
  });

  searchBox.addEventListener("input", function () {
    const query = this.value.toLowerCase();
    const filtered = currentSolutions.filter(sol =>
      sol.name.toLowerCase().includes(query) || sol.date.includes(query)
    );
    renderSolutions(filtered);
  });

  function renderSolutions(list) {
    solutionList.innerHTML = "";
    if (list.length === 0) {
      solutionList.innerHTML = "<p style='color:var(--muted); text-align:center;'>No results found</p>";
      return;
    }

    const ul = document.createElement("ul");
    ul.style.cssText = "display:grid; gap:14px; padding:0; margin:0;";
    list.forEach((sol, index) => {
      const li = document.createElement("li");
      li.className = "sol-item" + (index === 0 ? " latest" : "");
      li.innerHTML = `
        <a href="${sol.file}" target="_blank">
          ${sol.name}
          <span class="date">${sol.date}</span>
          ${index === 0 ? '<span class="sol-badge">Latest</span>' : ""}
        </a>`;
      ul.appendChild(li);
    });

    solutionList.appendChild(ul);
  }
</script>
</body>
</html>
